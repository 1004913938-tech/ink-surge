# 知音字幕 ZhiYin server (livecaption/server): test on every change, deploy to Cloudflare Workers from main.
# The owner sets 4 repository secrets once (see livecaption/server/README.md) and clicks "Run workflow".
# Without the secrets the deploy job finishes green with a notice and deploys nothing.
# Secrets are mapped into STEP-level env only (never job-level), so npm install scripts never see them.
name: Deploy ZhiYin server (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ["livecaption/server/**", ".github/workflows/zhiyin-server.yml"]
  pull_request:
    paths: ["livecaption/server/**", ".github/workflows/zhiyin-server.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "zhiyin-worker-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: livecaption/server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: livecaption/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # unit tests + local end-to-end (wrangler dev + mock Deepgram; no Cloudflare or Deepgram account needed)
      - run: npm test
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/zy-dry"
        env:
          WRANGLER_SEND_METRICS: "false"

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # to start pages.yml at the end, so the page shows 授权码 mode
    steps:
      - name: Check repository secrets
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DEEPGRAM_API_KEY ADMIN_PASSWORD; do
            [ -z "${!n}" ] && missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ZhiYin server not deployed::Missing repository secrets:$missing"
            echo "### 知音服务器未部署：缺少 secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${#ADMIN_PASSWORD}" -lt 16 ]; then echo "::error::ADMIN_PASSWORD needs at least 16 characters"; exit 1; fi
          # Pasted values often carry spaces/newlines, a "Bearer " prefix, or the whole dashboard URL instead of the ID.
          tok=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]'); tok=${tok#Bearer}; tok=${tok#bearer}
          acc=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | grep -oiE '[0-9a-f]{32}' | head -n1 || true)
          if [ -z "$acc" ]; then
            echo "::error title=CLOUDFLARE_ACCOUNT_ID::不是 32 位的账户 ID。打开 Cloudflare 后台，复制地址栏 dash.cloudflare.com/ 后面那串 32 位字母数字，重新填这个 secret"
            exit 1
          fi
          if [ "${#tok}" -lt 30 ]; then
            echo "::error title=CLOUDFLARE_API_TOKEN::太短，不像 Cloudflare API Token。请重新创建 Token（模板 Edit Cloudflare Workers）并完整复制"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: livecaption/server/package-lock.json
      # Install the pinned wrangler here, in a step WITHOUT secrets, so no install script ever runs next to them.
      - name: Install dependencies (no secrets in this step)
        if: steps.check.outputs.ready == 'true'
        working-directory: livecaption/server
        run: npm ci
      - name: Ensure workers.dev subdomain
        id: sub
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tok=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]'); tok=${tok#Bearer}; tok=${tok#bearer}
          acc=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | grep -oiE '[0-9a-f]{32}' | head -n1 | tr 'A-F' 'a-f' || true)
          echo "::add-mask::$tok"
          base="${CF_API_BASE:-https://api.cloudflare.com/client/v4}"
          # cf METHOD URL [JSON]: sets CODE and BODY; never fails the step by itself (curl -f would hide Cloudflare's error text)
          cf() {
            local out
            out=$(curl -sS --max-time 30 -w '\n%{http_code}' -X "$1" -H "Authorization: Bearer $tok" -H "Content-Type: application/json" \
              ${3:+--data "$3"} "$2") || out=$'\n000'
            CODE=${out##*$'\n'}; BODY=${out%$'\n'*}
          }
          errs() { jq -r '[.errors[]? | "\(.code) \(.message)"] | join("; ")' <<<"$BODY" 2>/dev/null || true; }
          has() { jq -e --argjson c "$1" '[.errors[]?.code] | index($c) != null' <<<"$BODY" >/dev/null 2>&1; }
          fail() {
            echo "::error title=$1::$2（Cloudflare 返回 HTTP $CODE：$(errs)）"
            { echo "### 知音服务器部署失败：$1"; echo "$2"; echo; echo "Cloudflare 返回 HTTP $CODE：$(errs)"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          BAD_TOKEN="CLOUDFLARE_API_TOKEN 无效、已删除或权限不够。请在 Cloudflare → 头像 → Profile → API Tokens 用模板 Edit Cloudflare Workers 重新创建（Account Resources 选你的账户，Zone Resources 选 All zones），完整复制后更新这个 secret，再 Run workflow"
          BAD_ACCOUNT="CLOUDFLARE_ACCOUNT_ID 不对。复制 Cloudflare 后台地址栏 dash.cloudflare.com/ 后面那串 32 位字母数字，更新这个 secret，再 Run workflow"

          # 1) the token itself (user tokens from Profile → API Tokens; account-owned tokens as a fallback)
          cf GET "$base/user/tokens/verify"
          if [ "$CODE" != 200 ] || [ "$(jq -r '.result.status // empty' <<<"$BODY")" != active ]; then
            cf GET "$base/accounts/$acc/tokens/verify"
            if [ "$CODE" != 200 ] || [ "$(jq -r '.result.status // empty' <<<"$BODY")" != active ]; then
              if has 7003 || has 7000; then fail CLOUDFLARE_ACCOUNT_ID "$BAD_ACCOUNT"; fi
              fail CLOUDFLARE_API_TOKEN "$BAD_TOKEN"
            fi
          fi

          # 2) the account's workers.dev subdomain (registered on first deploy)
          api="$base/accounts/$acc/workers/subdomain"
          cf GET "$api"
          sub=""
          if [ "$CODE" = 200 ]; then
            sub=$(jq -r '.result.subdomain // empty' <<<"$BODY")
          elif [ "$CODE" = 404 ] || has 10007; then
            sub=""
          elif has 7003 || has 7000 || [ "$CODE" = 400 ]; then
            fail CLOUDFLARE_ACCOUNT_ID "$BAD_ACCOUNT"
          else
            # the token itself is valid (checked above), so it does not cover this account
            fail "CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN" "Token 有效，但没有这个账户的权限：确认 CLOUDFLARE_ACCOUNT_ID 来自同一个 Cloudflare 账户，并且创建 Token 时 Account Resources 选的是这个账户。改好后再 Run workflow"
          fi
          if [ -z "$sub" ]; then
            sub="zhiyin-$(printf %s "$acc" | sha256sum | cut -c1-10)"
            cf PUT "$api" "{\"subdomain\":\"$sub\"}"
            if [ "$CODE" != 200 ]; then fail "workers.dev" "注册 workers.dev 子域名失败。可以在 Cloudflare → Compute → Workers & Pages 页面手动设置一个子域名，再 Run workflow"; fi
            echo "::notice::Registered $sub.workers.dev (DNS may take a few minutes)"
          fi
          echo "url=https://zhiyin-api.$sub.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Deploy Worker
        if: steps.check.outputs.ready == 'true'
        working-directory: livecaption/server
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DG_KEY_RAW: ${{ secrets.DEEPGRAM_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          CLOUDFLARE_API_TOKEN=$(printf %s "$CF_TOKEN_RAW" | tr -d '[:space:]'); CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN#Bearer}
          CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN#bearer}
          CLOUDFLARE_ACCOUNT_ID=$(printf %s "$CF_ACCOUNT_RAW" | grep -oiE '[0-9a-f]{32}' | head -n1 | tr 'A-F' 'a-f' || true)
          DEEPGRAM_API_KEY=$(printf %s "$DG_KEY_RAW" | tr -d '[:space:]'); DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY#Token}
          DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY#token}
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"; echo "::add-mask::$DEEPGRAM_API_KEY"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DEEPGRAM_API_KEY
          # one upload: code, DO migration and both secrets together (works on the very first deploy too)
          umask 077; sf="$RUNNER_TEMP/zhiyin-secrets.json"
          jq -n '{DEEPGRAM_API_KEY: env.DEEPGRAM_API_KEY, ADMIN_PASSWORD: env.ADMIN_PASSWORD}' > "$sf"
          trap 'rm -f "$sf"' EXIT
          npx wrangler deploy --secrets-file "$sf"
      - name: Smoke test and summary
        if: steps.check.outputs.ready == 'true'
        env:
          URL: ${{ steps.sub.outputs.url }}
        run: |
          ok=no; for _ in $(seq 1 12); do curl -fsS "$URL/api/config" | jq -e '.service=="zhiyin"' >/dev/null && { ok=yes; break; }; sleep 15; done
          [ "$ok" = yes ] || echo "::warning::$URL not answering yet (new workers.dev DNS can take minutes)"
          { echo "### 知音服务器已部署"; echo "- 服务器: $URL"; echo "- 店主后台: $URL/admin"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Rebuild the page so it shows 授权码 mode
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
